<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VDB Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a13;--card:#0d1322;--card2:#131b2e;--border:rgba(99,102,241,.12);--border2:rgba(99,102,241,.25);--text:#e2e8f0;--dim:#64748b;--faint:#334155;--muted:#475569;--accent:#6366f1;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--card)}::-webkit-scrollbar-thumb{background:var(--faint);border-radius:3px}
.header{background:linear-gradient(135deg,var(--card) 0%,#0f1a33 100%);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;box-shadow:0 0 20px rgba(99,102,241,.25)}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.5px}.header .sub{font-size:11px;color:var(--dim);margin-top:1px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.period-bar{display:flex;gap:4px}
.pbtn{padding:7px 16px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.pbtn:hover{border-color:var(--accent);color:var(--text)}.pbtn.active{background:rgba(99,102,241,.12);border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;padding:8px 24px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 18px;border-radius:7px;border:none;background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{background:rgba(99,102,241,.12);color:var(--accent)}
.content{padding:20px 24px;max-width:1280px;margin:0 auto}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;border-top:3px solid var(--accent)}
.kpi:hover{border-color:var(--border2);transform:translateY(-1px);transition:all .15s}
.kl{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;line-height:1.1;font-family:'JetBrains Mono',monospace}
.ks{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.ct{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.ct::after{content:'';flex:1;height:1px;background:var(--border)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:768px){.g2{grid-template-columns:1fr}.kg{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
table{width:100%;border-collapse:collapse}th{padding:8px 10px;text-align:left;color:var(--dim);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0}
th.r,td.r{text-align:right}td{padding:7px 10px;border-bottom:1px solid rgba(51,65,85,.3);font-size:11px;color:var(--dim)}
td.m{font-family:'JetBrains Mono',monospace;font-size:10px}td.n{color:var(--text);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.h{font-weight:700}tr:hover td{background:rgba(99,102,241,.03)}
.tbl{overflow-x:auto;max-height:500px;overflow-y:auto}
.bc{display:flex;align-items:center;gap:10px;margin-bottom:6px}.bl{width:200px;font-size:11px;color:var(--dim);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:24px;background:var(--card2);border-radius:5px;overflow:hidden}.bf{height:100%;border-radius:5px;min-width:4px}
.bv{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;min-width:55px;text-align:right}
.pr{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(51,65,85,.2)}
.pc{font-size:12px;color:var(--text);line-height:1.4}.pb{display:inline-block;padding:2px 8px;border-radius:5px;font-size:9px;font-weight:700;margin-top:5px}
.pm{display:flex;gap:18px;font-size:11px}.pmv{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:14px;text-align:center}.pml{color:var(--dim);font-size:9px;text-transform:uppercase;margin-top:1px;text-align:center}
.cw{height:300px;position:relative}.hidden{display:none}
.sq{margin-bottom:28px}.sqt{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sqn{background:var(--accent);color:#fff;font-size:9px;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.footer{text-align:center;padding:30px 0 12px;font-size:10px;color:var(--faint)}
.loading{text-align:center;padding:80px 20px;color:var(--dim)}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{text-align:center;padding:60px 20px;color:var(--red)}
</style></head>
<body>
<div class="header"><div class="header-left"><div class="logo">VDB</div><div><h1>Command Center</h1><div class="sub"><span class="live-dot"></span>Dados ao vivo &#8226; Mentor Gui Andrade</div></div></div><div class="period-bar" id="pbar"></div></div>
<div class="tabs" id="tabbar"></div>
<div class="content" id="main"><div class="loading"><div class="spinner"></div><p>Carregando dados do dashboard...</p></div></div>
<div class="footer" id="footer"></div>

<script>
var D=null,cT='overview',cP=30,ch={},CA=['#6366f1','#10b981','#f59e0b','#06b6d4','#a855f7','#ec4899','#0ea5e9','#84cc16','#f43f5e','#14b8a6'];
var API_URL='https://bxpkdevwsvmwuctgixnz.supabase.co/functions/v1/dashboard-data?token=vdb2026';

function fN(n){if(n==null)return'-';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.round(n).toLocaleString('pt-BR')}
function fR(n){if(n==null)return'-';return'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fP(n){return n==null?'-':n.toFixed(2)+'%'}
function fD(d){var p=String(d).split('-');return p[2]+'/'+p[1]}
function fT(s){var m=Math.floor(s/60);return m>0?m+'m '+Math.round(s%60)+'s':Math.round(s)+'s'}
function co(){if(cP>=9000)return'2000-01-01';var d=new Date();d.setDate(d.getDate()-cP);return d.toISOString().split('T')[0]}
function fd(a,k){var c=co();return a.filter(function(r){return String(r[k])>=c})}
function sm(a,k){return a.reduce(function(t,r){return t+Number(r[k]||0)},0)}
function dc(id){if(ch[id]){ch[id].destroy();delete ch[id]}}
function mc(id,cfg){dc(id);var ctx=document.getElementById(id);if(!ctx)return;ch[id]=new Chart(ctx,Object.assign({},cfg,{options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a2440',titleColor:'#64748b',bodyColor:'#e2e8f0',borderColor:'rgba(99,102,241,.2)',borderWidth:1,padding:10}},scales:Object.assign({x:{grid:{color:'rgba(51,65,85,.15)'},ticks:{color:'#475569',font:{size:9}}},y:{grid:{color:'rgba(51,65,85,.15)'},ticks:{color:'#475569',font:{size:9}}}},((cfg.options||{}).scales||{}))}}))}
function K(c,l,v,s){return'<div class="kpi" style="border-top-color:var(--'+c+')"><div class="kl">'+l+'</div><div class="kv" style="color:var(--'+c+')">'+v+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>'}

function rO(){
var md=fd(D.meta.daily,'d'),gd=fd(D.ga4.daily,'date'),ig=fd(D.ig.daily,'date');
var ms=sm(md,'spend'),ml=sm(md,'leads'),mp=sm(md,'purch'),cpl=ml>0?ms/ml:0;
var ss=sm(gd,'sessions'),nu=sm(gd,'new_users'),ir=sm(ig,'reach'),iv=sm(ig,'views'),ii=sm(ig,'total_interactions');
var e=document.getElementById('tab-overview');
e.innerHTML='<div class="kg">'+K('orange','Investimento Ads',fR(ms),ml+' leads &#8226; '+mp+' vendas')+K('cyan','CPL M&#233;dio',fR(cpl),'Custo por Lead')+K('green','Sess&#245;es Site',fN(ss),fN(nu)+' novos')+K('purple','Alcance IG',fN(ir),fN(iv)+' views')+K('pink','Intera&#231;&#245;es IG',fN(ii))+'</div>'
+'<div class="card"><div class="ct">Investimento + Leads Di&#225;rios</div><div class="cw"><canvas id="c1"></canvas></div></div>'
+'<div class="g2"><div class="card"><div class="ct">Sess&#245;es do Site</div><div class="cw" style="height:240px"><canvas id="c2"></canvas></div></div><div class="card"><div class="ct">Alcance Instagram</div><div class="cw" style="height:240px"><canvas id="c3"></canvas></div></div></div>';
mc('c1',{type:'bar',data:{labels:md.map(function(r){return fD(r.d)}),datasets:[{type:'bar',label:'Gasto R$',data:md.map(function(r){return+r.spend}),backgroundColor:'rgba(245,158,11,.4)',borderColor:'#f59e0b',borderWidth:1,borderRadius:3,yAxisID:'y'},{type:'line',label:'Leads',data:md.map(function(r){return+r.leads}),borderColor:'#10b981',borderWidth:2,pointRadius:0,tension:.3,yAxisID:'y1'}]},options:{scales:{y:{position:'left'},y1:{position:'right',grid:{display:false}}}}});
mc('c2',{type:'line',data:{labels:gd.map(function(r){return fD(r.date)}),datasets:[{label:'Sessoes',data:gd.map(function(r){return+r.sessions}),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.08)',fill:true,tension:.3,pointRadius:0},{label:'Novos',data:gd.map(function(r){return+r.new_users}),borderColor:'#06b6d4',borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.3}]}});
mc('c3',{type:'line',data:{labels:ig.map(function(r){return fD(r.date)}),datasets:[{label:'Alcance',data:ig.map(function(r){return+r.reach}),borderColor:'#a855f7',backgroundColor:'rgba(168,85,247,.08)',fill:true,tension:.3,pointRadius:0},{label:'Views',data:ig.map(function(r){return+r.views}),borderColor:'#ec4899',borderWidth:1.5,pointRadius:0,tension:.3}]}})}

function rM(){
var md=fd(D.meta.daily,'d');var sp=sm(md,'spend'),im=sm(md,'impr'),cl=sm(md,'clicks'),ld=sm(md,'leads'),pu=sm(md,'purch');
var ctr=im>0?cl/im*100:0,cpl=ld>0?sp/ld:0,cpa=pu>0?sp/pu:0;
var rows='';D.meta.campaigns.forEach(function(r){var ct=r.impr>0?r.clicks/r.impr*100:0;var cp=r.clicks>0?r.spend/r.clicks:0;var cl2=r.leads>0?r.spend/r.leads:0;
rows+='<tr><td class="n">'+r.campaign_name+'</td><td class="r m">'+fR(r.spend)+'</td><td class="r m">'+fN(r.impr)+'</td><td class="r m">'+fN(r.clicks)+'</td><td class="r m">'+fP(ct)+'</td><td class="r m">'+fR(cp)+'</td><td class="r m">'+(r.leads||0)+'</td><td class="r m">'+(r.leads>0?fR(cl2):'-')+'</td><td class="r m">'+(r.purch||0)+'</td></tr>'});
var e=document.getElementById('tab-meta');
e.innerHTML='<div class="kg">'+K('orange','Investimento',fR(sp))+K('blue','Impress&#245;es',fN(im))+K('cyan','Cliques',fN(cl),'CTR: '+fP(ctr))+K('green','Leads',String(ld),'CPL: '+fR(cpl))+K('pink','Vendas',String(pu),pu>0?'CPA: '+fR(cpa):'-')+'</div>'
+'<div class="card"><div class="ct">Gasto Di&#225;rio</div><div class="cw"><canvas id="c4"></canvas></div></div>'
+'<div class="card"><div class="ct">Campanhas</div><div class="tbl"><table><thead><tr><th>Campanha</th><th class="r">Gasto</th><th class="r">Impr.</th><th class="r">Cliques</th><th class="r">CTR</th><th class="r">CPC</th><th class="r">Leads</th><th class="r">CPL</th><th class="r">Vendas</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
mc('c4',{type:'bar',data:{labels:md.map(function(r){return fD(r.d)}),datasets:[{label:'Gasto R$',data:md.map(function(r){return+r.spend}),backgroundColor:'rgba(245,158,11,.5)',borderColor:'#f59e0b',borderWidth:1,borderRadius:3}]}})}

function rW(){
var gd=fd(D.ga4.daily,'date');var ss=sm(gd,'sessions'),nu=sm(gd,'new_users');
var sr='';(D.ga4.sources||[]).forEach(function(r){sr+='<tr><td class="n">'+(r.src||'')+'</td><td class="r m">'+fN(r.sessions)+'</td><td class="r m">'+fN(r.users)+'</td><td class="r m">'+fN(r.new_users)+'</td></tr>'});
var pg='';(D.ga4.pages||[]).forEach(function(r){var t=(r.page_title||r.page_path||'');pg+='<tr><td class="n">'+t+'</td><td class="r m">'+fN(r.views)+'</td><td class="r m">'+fN(r.users)+'</td><td class="r m">'+fT(r.eng||0)+'</td></tr>'});
var e=document.getElementById('tab-website');
e.innerHTML='<div class="kg">'+K('green','Sess&#245;es',fN(ss))+K('cyan','Novos Usu&#225;rios',fN(nu))+K('accent','Leads Capturados',String(D.leads.length))+'</div>'
+'<div class="card"><div class="ct">Sess&#245;es Di&#225;rias</div><div class="cw"><canvas id="c5"></canvas></div></div>'
+'<div class="g2"><div class="card"><div class="ct">Fontes de Tr&#225;fego</div><div class="tbl"><table><thead><tr><th>Fonte/Meio</th><th class="r">Sess&#245;es</th><th class="r">Usu&#225;rios</th><th class="r">Novos</th></tr></thead><tbody>'+sr+'</tbody></table></div></div><div class="card"><div class="ct">Top P&#225;ginas</div><div class="tbl"><table><thead><tr><th>P&#225;gina</th><th class="r">Views</th><th class="r">Usu&#225;rios</th><th class="r">Engaj.</th></tr></thead><tbody>'+pg+'</tbody></table></div></div></div>';
mc('c5',{type:'line',data:{labels:gd.map(function(r){return fD(r.date)}),datasets:[{label:'Sessoes',data:gd.map(function(r){return+r.sessions}),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.08)',fill:true,tension:.3,pointRadius:0},{label:'Novos',data:gd.map(function(r){return+r.new_users}),borderColor:'#06b6d4',borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.3}]}})}

function rIG(){
var ig=fd(D.ig.daily,'date');var rc=sm(ig,'reach'),vw=sm(ig,'views'),it=sm(ig,'total_interactions'),lk=sm(ig,'like_count'),sv=sm(ig,'saves');
var ps='';(D.ig.posts||[]).slice(0,12).forEach(function(p){var tp=(p.media_type||'').indexOf('CAROUSEL')>=0?'Carrossel':'Video';var tc=tp==='Carrossel'?'var(--accent)':'var(--pink)';var tb=tp==='Carrossel'?'rgba(99,102,241,.12)':'rgba(236,72,153,.12)';
ps+='<div class="pr"><div><div class="pc">'+(p.caption||'').substring(0,100)+'</div><span class="pb" style="background:'+tb+';color:'+tc+'">'+tp+'</span></div><div class="pm"><div><div class="pmv" style="color:var(--purple)">'+fN(p.reach)+'</div><div class="pml">Alcance</div></div><div><div class="pmv" style="color:var(--pink)">'+fN(p.views)+'</div><div class="pml">Views</div></div><div><div class="pmv" style="color:var(--red)">'+fN(p.like_count)+'</div><div class="pml">Likes</div></div><div><div class="pmv" style="color:var(--orange)">'+fN(p.saves)+'</div><div class="pml">Saves</div></div><div><div class="pmv" style="color:var(--green)">'+fN(p.total_interactions)+'</div><div class="pml">Inter.</div></div></div></div>'});
var e=document.getElementById('tab-ig');
e.innerHTML='<div class="kg">'+K('purple','Alcance',fN(rc))+K('pink','Views',fN(vw))+K('green','Intera&#231;&#245;es',fN(it))+K('red','Curtidas',fN(lk))+K('orange','Saves',fN(sv))+'</div>'
+'<div class="card"><div class="ct">Alcance + Views Di&#225;rios</div><div class="cw"><canvas id="c6"></canvas></div></div>'
+'<div class="card"><div class="ct">Top Posts</div>'+ps+'</div>';
mc('c6',{type:'line',data:{labels:ig.map(function(r){return fD(r.date)}),datasets:[{label:'Alcance',data:ig.map(function(r){return+r.reach}),borderColor:'#a855f7',backgroundColor:'rgba(168,85,247,.08)',fill:true,tension:.3,pointRadius:0},{label:'Views',data:ig.map(function(r){return+r.views}),borderColor:'#ec4899',borderWidth:1.5,pointRadius:0,tension:.3},{label:'Interacoes',data:ig.map(function(r){return+r.total_interactions}),borderColor:'#10b981',borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.3}]}})}

function rS(){
var e=document.getElementById('tab-survey');var qs=D.survey.questions||[];var di=D.survey.distributions||{};
var h='<div class="kg">'+K('cyan','Total Respostas',String(D.survey.total))+'</div>';
for(var i=0;i<qs.length;i++){var q=qs[i];var it=di[q.key]||[];if(!it.length)continue;var mx=it[0].cnt||1;
h+='<div class="sq"><div class="sqt"><span class="sqn">'+(i+1)+'</span>'+q.label+'</div>';
for(var j=0;j<it.length;j++){var a=it[j];var pct=Math.round(a.cnt/D.survey.total*100);var w=Math.max(a.cnt/mx*100,3);
h+='<div class="bc"><div class="bl" title="'+a.ans+'">'+a.ans+'</div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+CA[i%CA.length]+'"></div></div><div class="bv">'+a.cnt+' ('+pct+'%)</div></div>'}
h+='</div>'}e.innerHTML=h}

function rL(){
var e=document.getElementById('tab-leads');var leads=D.leads||[];var sales=D.sales||[];
var real=leads.filter(function(l){return l.email&&!(l.name||'').match(/teste/i)});
var h='<div class="kg">'+K('green','Total Leads',String(leads.length),real.length+' reais')+K('pink','Vendas',String(sales.length))+K('orange','Receita',sales.length>0?fR(sm(sales,'revenue')):'-')+'</div>';
h+='<div class="card"><div class="ct">Leads Capturados</div><div class="tbl"><table><thead><tr><th>Nome</th><th>Email</th><th>Origem</th><th>Campanha</th><th>Device</th><th>Data</th></tr></thead><tbody>';
leads.forEach(function(l){var dt=l.lead_captured_at?new Date(l.lead_captured_at).toLocaleDateString('pt-BR'):'-';
h+='<tr><td class="n">'+(l.name||'-')+'</td><td class="m">'+(l.email||'-')+'</td><td>'+(l.utm_source||'-')+'/'+(l.utm_medium||'-')+'</td><td class="n">'+(l.utm_campaign||'-')+'</td><td>'+(l.device||'-')+'</td><td class="m">'+dt+'</td></tr>'});
h+='</tbody></table></div></div>';e.innerHTML=h}

var TABS=['overview','meta','website','ig','survey','leads'];
var TLBL=['Visao Geral','Meta Ads','Website','Instagram','Pesquisa','Leads & Vendas'];
var PERS=[7,14,30,60,90,9999],PLBL=['7d','14d','30d','60d','90d','Tudo'];

function init(){
var tb=document.getElementById('tabbar'),pb=document.getElementById('pbar');
for(var i=0;i<TABS.length;i++){var b=document.createElement('button');b.className='tab'+(TABS[i]==='overview'?' active':'');b.textContent=TLBL[i];b.setAttribute('data-tab',TABS[i]);b.onclick=function(){sT(this.getAttribute('data-tab'))};tb.appendChild(b)}
for(var j=0;j<PERS.length;j++){var p=document.createElement('button');p.className='pbtn'+(PERS[j]===30?' active':'');p.textContent=PLBL[j];p.setAttribute('data-per',String(PERS[j]));p.onclick=function(){sP(Number(this.getAttribute('data-per')))};pb.appendChild(p)}}

function sT(id){cT=id;document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')===id)});document.querySelectorAll('[id^="tab-"]').forEach(function(e){e.classList.toggle('hidden',e.id!=='tab-'+id)});ren()}
function sP(d){cP=d;document.querySelectorAll('.pbtn').forEach(function(b){b.classList.toggle('active',Number(b.getAttribute('data-per'))===d)});ren()}
function ren(){if(!D)return;var fn={overview:rO,meta:rM,website:rW,ig:rIG,survey:rS,leads:rL};if(fn[cT])fn[cT]();document.getElementById('footer').textContent='VDB Command Center - Atualizado: '+new Date(D.generated).toLocaleString('pt-BR')}

init();

fetch(API_URL)
